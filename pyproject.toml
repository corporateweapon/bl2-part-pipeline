[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bl2-part-pipeline"
version = "0.12.0"
description = "Borderlands 2 custom weapon pipeline: Blender/glTF mesh -> gestalt fragments in a new .upk, registered at runtime by a generated pyunrealsdk mod, verified by an unattended in-game loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bl2 = "bl2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
