[project]
name = "Armory"
version = "1.0.0"
authors = [{ name = "44M0N" }]
description = """\
Loads custom weapons from weapon packs (sdk_mods/ArmoryPacks) and lets you spawn them: \
console 'armory spawn <id>', the Armory menu page, or F5 for the selected weapon. \
Weapon packs are built with the bl2-part-pipeline; see CREATING_PACKS.md.
"""
dependencies = []

[tool.sdkmod]
name = "Armory"
version = "1.0.0"
mod_type = "Standard"
supported_games = ["BL2"]
coop_support = "RequiresAllPlayers"
auto_enable = true
license = { name = "MIT", url = "https://opensource.org/license/mit" }
